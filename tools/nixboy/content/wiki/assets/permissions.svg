<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" role="img" aria-labelledby="title description">
  <title id="title">Read a regular file's permission mode</title>
  <desc id="description">The example mode is -rw-r-----. The leading dash marks a regular file. Owner has read and write, group has read, and others have no permissions.</desc>
  <rect x="1" y="1" width="778" height="248" rx="14" fill="#0b2019" stroke="#669b73" stroke-width="2"/>
  <g fill="#d6f5d5" font-family="monospace" text-anchor="middle">
    <text x="390" y="38" font-size="20">ls -l: -rw-r-----</text>
    <g stroke="#8dbe92" stroke-width="2" fill="#173a29">
      <rect x="24" y="63" width="108" height="90" rx="6"/>
      <rect x="150" y="63" width="188" height="90" rx="6"/>
      <rect x="356" y="63" width="188" height="90" rx="6"/>
      <rect x="562" y="63" width="188" height="90" rx="6"/>
    </g>
    <g font-size="38">
      <text x="78" y="105">-</text>
      <text x="244" y="105">rw-</text>
      <text x="450" y="105">r--</text>
      <text x="656" y="105">---</text>
    </g>
    <g font-size="17">
      <text x="78" y="135">type</text>
      <text x="244" y="135">owner</text>
      <text x="450" y="135">group</text>
      <text x="656" y="135">others</text>
    </g>
    <g font-size="16">
      <text x="78" y="183">regular</text>
      <text x="78" y="204">file</text>
      <text x="244" y="183">read + write</text>
      <text x="450" y="183">read</text>
      <text x="656" y="183">no access</text>
      <text x="450" y="227">r = read   w = write   x = execute</text>
    </g>
  </g>
</svg>
